<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png"
                 class="logo" alt="Logo">
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li>
                <a href="#">Home</a>

                <!-- Dropdown -->
                <ul class="dropdown">
                    <li><a href="#">Item 1</a></li>
                    <li><a href="#">Item 2</a></li>
                    <li><a href="#">Item 3</a></li>
                    <li><a href="#">Item 4</a></li>
                </ul>
            </li>

            <li><a href="#">About</a></li>
            <li><a href="#">Model</a></li>
            <li><a href="#">Others</a></li>
        </ul>
    </nav>

    <!-- Dropdown Information Area -->
    <div class="info-area">
        <div class="menu-box">
            <div class="menu-title">Username</div>
            <div class="menu-item">Item 1</div>
            <div class="menu-item">Item 2</div>
            <div class="menu-item">Item 3</div>
        </div>
    </div>

    <!-- Forms Section -->
    <section class="container">

        <!-- Sign In -->
        <div class="box">
            <h2>Sign In</h2>

            <form>
                <label>Username</label>
                <input type="text"
                       placeholder="Enter Username / Email / Phone Number">

                <label>Password</label>
                <input type="password"
                       placeholder="Enter Password">

                <input type="submit" value="Sign In">
            </form>
        </div>

        <!-- Sign Up -->
        <div class="box">
            <h2>Sign Up</h2>

            <form>
                <label>Name</label>
                <input type="text"
                       placeholder="Enter Name">

                <label>Email</label>
                <input type="email"
                       placeholder="Enter Email">

                <label>Password</label>
                <input type="password"
                       placeholder="Enter Password">

                <input type="submit" value="Sign Up">
            </form>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p class="address">Your address</p>

        <p>
            © 2026-2027. URK00XX0000 -
            Web Technology Lab Batch 1.
            All Rights Reserved.
        </p>
    </footer>

</body>
</html>
